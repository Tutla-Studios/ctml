plugins {
    id 'com.gradleup.shadow'
    id 'xyz.jpenilla.run-paper'
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

configurations {
    // Files in this configuration are bundled into the final plugin jar.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    implementation.extendsFrom shadowBundle
}

dependencies {
    // Only Bukkit API is used, so the plugin also runs on Spigot and Bukkit.
    compileOnly "io.papermc.paper:paper-api:${rootProject.paper_api_version}"

    shadowBundle(project(':common')) { transitive = false }
}

processResources {
    def props = [version: project.version, api_version: rootProject.plugin_api_version]
    inputs.properties props

    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'slim'
}

assemble.dependsOn shadowJar

// The scripts the client runs from run/ctml/ui, copied into the test server's ui folder on every start, so
// /ctml demo and /ctml run work on the same files. Anything else put in that folder by hand is left alone.
tasks.register('copyTestUi', Copy) {
    from rootProject.file('run/ctml/ui')
    into layout.projectDirectory.dir('run/plugins/CraftyTML/ui')
}

// ./gradlew :paper:runServer starts a Paper test server in src/paper/run with the plugin loaded, and Tums
// beside it, since the plugin depends on it.
tasks.named('runServer') {
    dependsOn 'copyTestUi'
    minecraftVersion(rootProject.minecraft_version)
    pluginJars(rootProject.tumsJar)
    jvmArgs('-Xms2G', '-Xmx2G')
}
