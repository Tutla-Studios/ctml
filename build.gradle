plugins {
    id 'base'
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '9.4.1' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Tums' universal jar (Fabric mod and Paper plugin in one), straight out of the Tums checkout next to
// this one: build it there with ./gradlew build first.
ext.tumsJar = file("../Tums/build/libs/tums-${project.tums_version}.jar")

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // Tusan, which ctml scripts are parsed and run with. Not bundled into CraftyTML: the same jar
        // is installed beside it, as a mod on Fabric and as a plugin on Paper.
        compileOnly files(rootProject.tumsJar)
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = 'UTF-8'
    }

    // The javadoc here carries ctml markup, in @ctml.example and in prose, and ctml is not html: it has
    // its own elements and its own properties, and nothing is gained by having it validate as html.
    // Every other doclint check still applies. The @ctml tags are the ones docs/generate.sh reads out of
    // the registered elements and properties to build the reference with.
    tasks.withType(Javadoc).configureEach {
        options.tags = [
                'ctml.group:t:Group:',
                'ctml.properties:t:Own properties:',
                'ctml.example:t:Example:',
                'ctml.on:t:Applies to:'
        ]
        options.addStringOption('Xdoclint:all,-html,-accessibility,-missing', '-quiet')
    }

    jar {
        from(rootProject.file('LICENSE.txt')) {
            rename { "${it}_${rootProject.archives_base_name}" }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

// One universal jar for Fabric and Spigot/Paper: build/libs/craftytml-<version>.jar
// Each loader only reads its own metadata (fabric.mod.json / plugin.yml) and only loads its own
// entrypoint, so the other platform's classes are never touched.
def mergedPlatforms = ['fabric', 'paper']

tasks.register('mergedJar', Jar) {
    group = 'build'
    description = 'Merges the Fabric and Paper jars into one universal jar.'

    archiveBaseName = rootProject.archives_base_name
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergedPlatforms.each { name ->
        def platformJar = project(":$name").tasks.named('shadowJar')
        dependsOn platformJar
        from({ zipTree(platformJar.get().archiveFile) }) {
            // Architectury's @ExpectPlatform glue differs per loader; CraftyTML doesn't use @ExpectPlatform.
            // If you add @ExpectPlatform methods later, ship per-loader jars instead.
            exclude 'architectury_inject_*/**'
            exclude 'META-INF/MANIFEST.MF'
        }
    }
}

tasks.named('assemble') { dependsOn 'mergedJar' }
