name: CraftyTML
version: '${version}'
main: net.tutla.craftytml.paper.CraftytmlPaper
api-version: '${api_version}'
authors: [TutlaMC]
description: everything is stone
depend: [Tums]

commands:
  ctml:
    description: Run ctml scripts for a player and show what they build
    usage: /ctml <open|run|demo|close|list|execute [targets] <name> [json] <ctml>|variable put/remove <name> <variable> [value]|callback put/remove <name> <callback> [command]>
    permission: craftytml.use

permissions:
  craftytml.use:
    description: Allows /ctml
    default: op
