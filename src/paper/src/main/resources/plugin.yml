name: CraftyTML
version: '${version}'
main: net.tutla.craftytml.paper.CraftytmlPaper
api-version: '${api_version}'
authors: [TutlaMC]
description: everything is stone
depend: [Tums]

commands:
  ctml:
    description: Open, close and list ctml windows
    usage: /ctml <open <name>|close|list>
    permission: craftytml.use

permissions:
  craftytml.use:
    description: Allows /ctml
    default: op
